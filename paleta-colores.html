<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis colores favoritos</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #fefefe;
    }

    h1 {
      text-align: center;
      background-color: #333;
      color: white;
      padding: 20px;
    }

    .colores {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }

    .bloque {
      width: 80%;
      max-width: 300px;
      padding: 30px;
      border-radius: 10px;
      color: white;
      font-size: 1.2em;
      text-align: center;
    }

    .felicidad { background-color: #ffadad; }
    .energia    { background-color: #ffd6a5; color: #333; }
    .calma      { background-color: #caffbf; color: #333; }
    .inspiracion { background-color: #9bf6ff; color: #333; }
  </style>
</head>
<body>

  <h1>Mis colores favoritos</h1>

  <div class="colores">
    <div class="bloque felicidad">Felicidad - #ffadad</div>
    <div class="bloque energia">Energía - #ffd6a5</div>
    <div class="bloque calma">Calma - #caffbf</div>
    <div class="bloque inspiracion">Inspiración - #9bf6ff</div>
  </div>

</body>
</html>
